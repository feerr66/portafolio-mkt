<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Fernanda Ubeda</title>

    <!-- Vinculamos la fuente moderna 'Outfit' desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Íconos vectoriales modernos (Lucide Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Librería de animaciones AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">

    <!-- Hoja de estilos CSS compartida -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- CAJA PRINCIPAL: Tarjeta blanca para la sección de Contacto -->
    <main class="card card-contact" data-aos="fade-up">

        <!-- 1. NAVEGACIÓN SUPERIOR COMÚN -->
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>

        <!-- 2. CONTENEDOR EN DOS COLUMNAS -->
        <div class="contact-layout">

            <!-- COLUMNA IZQUIERDA: Encabezado y Formulario -->
            <div class="contact-left" data-aos="fade-up" data-aos-delay="100">
                <header class="projects-header">
                    <h1 class="projects-title">Contacto</h1>
                    <div class="projects-title-bar"></div>
                    <p class="projects-subtitle">
                        ¿Tienes un proyecto en mente?<br>
                        ¡Hablemos! Completa el formulario<br>
                        y me pondré en contacto contigo.
                    </p>
                </header>

                <form class="contact-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntame sobre tu proyecto..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i data-lucide="send"></i>
                        <span>Enviar mensaje</span>
                    </button>
                </form>
            </div>

            <!-- COLUMNA DERECHA: Ilustración y Tarjeta de correo directo -->
            <div class="contact-right">
                <div class="contact-illustration" data-aos="zoom-in" data-aos-delay="200">
                    <img src="img/contacto.png" alt="Ilustración 3D de sobre con carta y avión de papel"
                        class="contact-img">
                </div>

                <div class="contact-card-box" data-aos="fade-up" data-aos-delay="300">
                    <div class="contact-card-icon">
                        <i data-lucide="mail"></i>
                    </div>
                    <div class="contact-card-text">
                        <p class="contact-card-title">También puedes escribirme a</p>
                        <a href="mailto:fernandabelen1980@gmail.com"
                            class="contact-card-email">fernandabelen1980@gmail.com</a>
                        <p class="contact-card-note">Responderé a la brevedad posible.</p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Script para renderizar los íconos de Lucide -->
    <script>
        lucide.createIcons();
    </script>

    <!-- Librería de animaciones AOS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>
</body>

</html>
